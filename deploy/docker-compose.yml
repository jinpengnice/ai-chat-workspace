
services:
  postgres:
    image: postgres:17
    container_name: ai-chat-workspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_chat_workspace
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ai_chat_workspace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
